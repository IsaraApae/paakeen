<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6E4E3">
<title>ป้าคีน</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Liquid Glass: controls and navigation float as translucent glass above an opaque content layer */
:root {
  color-scheme: light dark;
  --bg: #F5F3F7; --surface: #FFFFFFBF; --fill: #7676801F; --track: #78788029;
  --label: #1C1C1E; --label2: #636366; --sep: #3C3C4338;
  /* the same red and green as dark mode, so both themes match */
  --red: #FF6961; --red-tint: #FF696126; --expense: #F0958E; --income: #8FD3A0; --switch: #34C759;
  --expense-text: #C24A44; --income-text: #35805A;  /* amounts stay darker on the light background so they read clearly */
  --wash: radial-gradient(70% 38% at 8% 0%, #FF3B3038, transparent 72%), radial-gradient(60% 34% at 100% 14%, #FF9F0A33, transparent 72%), radial-gradient(60% 34% at 0% 62%, #AF52DE1F, transparent 72%), radial-gradient(80% 40% at 70% 100%, #FF2D552E, transparent 72%);
  --glass: #FFFFFF8C; --glass-strong: #FFFFFFC7; --glass-edge: #FFFFFFB3;
  --glass-shine: inset 0 1px 0 #FFFFFFE6, inset 0 -1px 0 #FFFFFF40;
  --glass-shadow: 0 10px 30px -6px #00000026, 0 2px 6px #0000000F;
  --sheet: #F2F2F7CC; --dim: #00000033;
  --top-solid: #F6E4E3;  /* average of --top-row: iPhone tints the status-bar strip with a solid colour */
  --top-row: linear-gradient(90deg, #F7D1D2 0%, #F7CCCD 10%, #F7D4D6 20%, #F6DCDE 30%, #F6E4E7 40%, #F5ECF0 50%, #F5F3F7 60%, #F5F1F2 70%, #F6EFEA 80%, #F6EDE5 90%, #F6ECE3 100%);  /* the --wash colours along its top edge, worked out from its gradients */
}
/* dark: follows the device unless the theme setting says light or dark */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #000000; --surface: #1C1C1EBF; --fill: #7676803D; --track: #78788052;
    --label: #F2F2F7; --label2: #A1A1A8; --sep: #54545899;
    --red: #FF6961; --red-tint: #FF696126; --expense: #F0958E; --income: #8FD3A0; --expense-text: #F0958E; --income-text: #8FD3A0;
    --wash: radial-gradient(70% 38% at 8% 0%, #FF3B3052, transparent 72%), radial-gradient(60% 34% at 100% 14%, #FF9F0A2E, transparent 72%), radial-gradient(60% 34% at 0% 62%, #5E5CE63D, transparent 72%), radial-gradient(80% 40% at 70% 100%, #FF2D5547, transparent 72%);
    --glass: #3A3A3C80; --glass-strong: #636366B3; --glass-edge: #FFFFFF24;
    --glass-shine: inset 0 1px 0 #FFFFFF2E, inset 0 -1px 0 #FFFFFF0F;
    --glass-shadow: 0 10px 30px -6px #00000080, 0 2px 6px #00000040;
    --sheet: #1C1C1ECC; --dim: #00000066;
    --top-solid: #200905;
    --top-row: linear-gradient(90deg, #45100D 0%, #4F120F 10%, #3E0E0C 20%, #2E0B09 30%, #1E0706 40%, #0E0303 50%, #000000 60%, #050300 70%, #0C0800 80%, #120B01 90%, #140C01 100%);
  }
}
:root[data-theme=dark] {
  --bg: #000000; --surface: #1C1C1EBF; --fill: #7676803D; --track: #78788052;
  --label: #F2F2F7; --label2: #A1A1A8; --sep: #54545899;
  --red: #FF6961; --red-tint: #FF696126; --expense: #F0958E; --income: #8FD3A0; --expense-text: #F0958E; --income-text: #8FD3A0;
  --wash: radial-gradient(70% 38% at 8% 0%, #FF3B3052, transparent 72%), radial-gradient(60% 34% at 100% 14%, #FF9F0A2E, transparent 72%), radial-gradient(60% 34% at 0% 62%, #5E5CE63D, transparent 72%), radial-gradient(80% 40% at 70% 100%, #FF2D5547, transparent 72%);
  --glass: #3A3A3C80; --glass-strong: #636366B3; --glass-edge: #FFFFFF24;
  --glass-shine: inset 0 1px 0 #FFFFFF2E, inset 0 -1px 0 #FFFFFF0F;
  --glass-shadow: 0 10px 30px -6px #00000080, 0 2px 6px #00000040;
  --sheet: #1C1C1ECC; --dim: #00000066;
  --top-solid: #200905;
  --top-row: linear-gradient(90deg, #45100D 0%, #4F120F 10%, #3E0E0C 20%, #2E0B09 30%, #1E0706 40%, #0E0303 50%, #000000 60%, #050300 70%, #0C0800 80%, #120B01 90%, #140C01 100%);
}
:root[data-theme=light] { color-scheme: light; }
:root[data-theme=dark] { color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
::selection { background: var(--red-tint); }
html { -webkit-text-size-adjust: 100%; background: var(--top-solid); }
body {
  margin: 0; color: var(--label); caret-color: var(--red); accent-color: var(--red);
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Sukhumvit Set", Thonburi, system-ui, sans-serif;
  padding-bottom: calc(104px + env(safe-area-inset-bottom));
}
#bg { position: fixed; inset: 0; z-index: -1; background: var(--wash), var(--bg); }
/* LINE's iPhone browser lets the page scroll up behind the clock but draws only scrolling content there, never the
   fixed #bg. #strip scrolls with the page, under #bg, in the colours along #bg's top edge: everywhere else #bg hides
   it, and behind the clock it carries the background up. */
body { position: relative; min-height: 100vh; }
#strip { position: absolute; inset: 0; z-index: -2; background: var(--top-row) var(--top-solid); }
main { max-width: 560px; margin: 0 auto; padding: calc(56px + env(safe-area-inset-top)) 16px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
h1 { margin: 0; font-size: 32px; line-height: 1.25; font-weight: 700; }
button, select, input { font: inherit; color: inherit; margin: 0; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { opacity: .3; }
:focus, :focus-visible { outline: none; }
.kbd :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }  /* only once Tab has been used */
dialog :is(b, input):focus { outline: none; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
canvas { max-width: 100%; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.expense { color: var(--expense-text); } .income { color: var(--income-text); }
.sub { font-size: 13px; color: var(--label2); }
.muted { color: var(--label2); }

/* the glass material */
nav, .ib, .pill, .cluster, .selbar, .seg, .chip, .pick, #toast {
  background: var(--glass); border: .5px solid var(--glass-edge); box-shadow: var(--glass-shine), var(--glass-shadow);
  -webkit-backdrop-filter: blur(22px) saturate(190%); backdrop-filter: blur(22px) saturate(190%);
}

/* large title; its actions float as glass at the top right */
.title { padding: 4px 4px 0; }
.acts { position: fixed; z-index: 3; top: calc(8px + env(safe-area-inset-top)); right: max(16px, calc(50vw - 264px)); display: flex; align-items: center; gap: 8px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--fill); border: .5px solid var(--glass-edge); box-shadow: var(--glass-shadow); }
.link { color: var(--red); font-size: 17px; padding: 6px 4px; }
.link:active, .ib:active, .pill:active { opacity: .55; }
.ib { width: 44px; height: 44px; border-radius: 50%; color: var(--label); display: grid; place-items: center; flex: none; transition: transform .2s cubic-bezier(.16, 1, .3, 1); }
.ib:active, .pill:active { transform: scale(.94); }
.tint { background: #C24A44; border-color: #FFFFFF40; color: #fff; font-weight: 600; box-shadow: inset 0 1px 0 #FFFFFF59, inset 0 -1px 0 #0000000F, 0 8px 20px -8px #00000038; }
.ib.small { width: 32px; height: 32px; color: var(--label2); box-shadow: var(--glass-shine); background: var(--fill); -webkit-backdrop-filter: none; backdrop-filter: none; }
.ib.small svg { width: 15px; height: 15px; }
.pill { height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 500; transition: transform .2s cubic-bezier(.16, 1, .3, 1); }
.pill.on { color: var(--red); font-weight: 600; }
.cluster { display: flex; border-radius: 999px; padding: 0 4px; }
.cluster button { width: 42px; height: 44px; display: grid; place-items: center; }
.cluster button:active { opacity: .5; }
.cluster .accent { color: var(--red); }

/* content layer: opaque grouped lists with the larger concentric radius */
.sect { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--label2); padding: 0 20px; margin: 12px 0 -8px; min-height: 22px; }
.sect .link { font-size: 15px; padding: 0; }
.foot { font-size: 13px; color: var(--label2); padding: 0 20px; margin: -8px 0 0; }
.group { background: var(--surface); border-radius: 26px; overflow: hidden; }
.group > * { position: relative; }
.group > * + *::before { content: ""; position: absolute; top: 0; left: 20px; right: 20px; height: 1px; background: var(--sep); transform: scaleY(.5); transform-origin: top; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 10px 20px; text-align: left; }
.row.tap { cursor: pointer; }
.row.tap:active { background: var(--fill); }
.row.center { justify-content: center; }
.grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.subrow { min-height: 40px; padding: 6px 20px 6px 44px; font-size: 15px; color: var(--label2); }
.chev { color: var(--label2); opacity: .55; width: 16px; height: 16px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.amt { font-weight: 600; }
.pad { padding: 18px 20px; }
.big { font-size: 34px; line-height: 1.2; font-weight: 700; }
.mid { font-size: 20px; font-weight: 600; }
.split { display: grid; grid-template-columns: 1fr 1fr; padding: 12px 20px 14px; gap: 12px; }
.split.three { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.split.three .mid { font-size: 19px; }
.chart { padding: 18px 14px 8px; }
.dash { display: inline-block; width: 14px; border-top: 1.5px dashed var(--label2); vertical-align: middle; margin-left: 4px; }
.donut { width: min(62%, 220px); margin: 0 auto; padding: 20px 0 12px; }
.inline-icon { width: 14px; height: 14px; vertical-align: -2px; color: #B58100; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--label2); display: grid; place-items: center; flex: none; color: transparent; }
.check.on { background: var(--red); border-color: var(--red); color: #fff; }
.check svg { width: 14px; height: 14px; stroke-width: 3; }
.empty { text-align: center; color: var(--label2); padding: 36px 24px; font-size: 15px; margin: 0; }

/* controls */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-radius: 999px; padding: 3px; }
.seg button { border-radius: 999px; padding: 6px 4px; font-size: 14px; font-weight: 500; min-height: 36px; }
.seg button.on { background: var(--glass-strong); font-weight: 600; box-shadow: var(--glass-shine), 0 3px 10px -2px #00000026, 0 0 0 .5px var(--glass-edge); }
.stepper { display: flex; align-items: center; justify-content: space-between; }
.stepper b { font-weight: 600; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: -8px -16px; padding: 8px 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border-radius: 999px; padding: 8px 16px; font-size: 15px; box-shadow: var(--glass-shine), 0 2px 8px -2px #0000001A; }
.chip.on { background: var(--red-tint); color: var(--red); font-weight: 600; }
.menu { appearance: none; -webkit-appearance: none; border: 0; background: none; color: var(--red); padding: 0; text-align: right; text-align-last: right; max-width: 62%; min-width: 0; }
input.menu::-webkit-date-and-time-value { text-align: right; }
.switch { appearance: none; -webkit-appearance: none; width: 64px; height: 28px; border-radius: 999px; background: var(--track); position: relative; flex: none; transition: background .25s; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 38px; height: 24px; border-radius: 999px; background: #fff; box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 8px #00000026, 0 1px 1px #00000029; transition: transform .3s cubic-bezier(.16, 1, .3, 1); }
.switch:checked { background: var(--switch); }
.switch:checked::after { transform: translateX(22px); }

/* floating tab bar */
.dock, .selbar { position: fixed; z-index: 3; left: max(16px, calc(50vw - 264px)); right: max(16px, calc(50vw - 264px)); bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; }
.dock .add { width: 58px; height: 58px; }
.dock .add svg { width: 26px; height: 26px; stroke-width: 2.2; }
nav { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(5, 1fr); border-radius: 999px; padding: 4px; }
.selbar { height: 58px; border-radius: 999px; padding: 0 8px 0 20px; }
.selbar .grow { font-weight: 600; white-space: nowrap; }
.selbar button { white-space: nowrap; flex: none; }
.selbar button { height: 42px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500; }
.selbar button:active { background: var(--fill); }
.selecting .dock { display: none; }
nav button { padding: 6px 0 5px; border-radius: 999px; color: var(--label); font-size: 11px; font-weight: 500; display: grid; justify-items: center; gap: 1px; transition: background .25s; }
nav button.on { color: var(--red); background: var(--fill); font-weight: 600; }
nav svg { width: 24px; height: 24px; stroke-width: 1.8; }

/* dialogs: a glass sheet for entries, a compact glass alert for one value or a confirmation */
dialog { border: .5px solid var(--glass-edge); background: var(--sheet); color: var(--label); overflow-y: auto; box-shadow: var(--glass-shine), 0 12px 50px #00000040; -webkit-backdrop-filter: blur(40px) saturate(200%); backdrop-filter: blur(40px) saturate(200%); }
dialog.sheet { margin: auto auto calc(8px + env(safe-area-inset-bottom)); width: calc(100% - 16px); max-width: 544px; height: calc(100dvh - 56px); padding: 0 16px 20px; border-radius: 38px; }
dialog.alert { margin: 18dvh auto auto; width: min(calc(100% - 48px), 340px); padding: 24px 18px 18px; border-radius: 34px; text-align: center; }
dialog.sheet[open] { animation: sheet .45s cubic-bezier(.16, 1, .3, 1); }
dialog.alert[open] { animation: pop .35s cubic-bezier(.16, 1, .3, 1); }
dialog.alert.typing[open] { animation: fade .25s ease-out; }  /* no zoom under a text field: iPhone drew the caret off to the side */
dialog::backdrop { background: var(--dim); animation: fade .25s ease-out; }
@keyframes sheet { from { transform: translateY(105%); } }
@keyframes pop { from { transform: scale(.88); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { dialog[open], dialog::backdrop { animation: none !important; } .switch, .switch::after, .ib, .pill, nav button { transition: none; } }
dialog form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.sheet-bar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding: 14px 0 0; }
.sheet-bar b, .alert b { font-weight: 600; text-align: center; }
.amount { display: flex; justify-content: center; align-items: baseline; gap: 6px; padding: 14px 0 6px; font-size: 56px; line-height: 1.15; font-weight: 700; color: var(--expense-text); font-variant-numeric: tabular-nums; }
.amount span { font-size: 28px; opacity: .55; }
.amount input { border: 0; background: none; padding: 0; text-align: center; min-width: 1.5ch; max-width: 80%; appearance: textfield; -moz-appearance: textfield; }
.amount input::-webkit-outer-spin-button, .amount input::-webkit-inner-spin-button { -webkit-appearance: none; }
.amount input::placeholder { color: inherit; opacity: .35; }
form[data-kind=income] .amount { color: var(--income-text); }
.only-custom { display: none; }
form[data-period=custom] .only-custom { display: flex; }
.group.only-custom { flex-direction: column; }
/* date and time pickers, drawn in the app's own style */
dialog.picker { margin: auto auto calc(8px + env(safe-area-inset-bottom)); width: calc(100% - 16px); max-width: 544px; max-height: calc(100dvh - 56px);
  padding: 18px 16px; border-radius: 38px; }
dialog.picker[open] { animation: sheet .45s cubic-bezier(.16, 1, .3, 1); }
dialog.picker > div { display: grid; gap: 12px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; text-align: center; }
.cal .wd { font-size: 12px; color: var(--label2); padding: 2px 0 6px; }
.cal button { height: 42px; font-size: 16px; font-variant-numeric: tabular-nums; }
.cal button .n { display: grid; place-items: center; width: 38px; height: 38px; margin: auto; border-radius: 50%; }
.cal button.in { background: var(--red-tint); }
.cal button.start { background: linear-gradient(90deg, transparent 50%, var(--red-tint) 50%); }
.cal button.end { background: linear-gradient(90deg, var(--red-tint) 50%, transparent 50%); }
.cal button.today .n { box-shadow: inset 0 0 0 1.5px var(--red); }
.cal button.sel .n { background: #C24A44; color: #fff; font-weight: 600; box-shadow: inset 0 1px 0 #FFFFFF59; }
/* time wheel: each column snaps one 44px row into the band in the middle */
.wheel { position: relative; display: flex; justify-content: center; align-items: center; gap: 4px; height: 220px; margin: 4px 0; }
.wheel .band { position: absolute; inset: 88px 0; border-radius: 14px; background: var(--fill); }
.wheel .col { position: relative; width: 88px; height: 100%; padding: 88px 0; box-sizing: border-box; overflow-y: scroll; scroll-snap-type: y mandatory;
  scrollbar-width: none; -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
.wheel .col::-webkit-scrollbar { display: none; }
.wheel .col div { height: 44px; line-height: 44px; text-align: center; scroll-snap-align: center; font-size: 24px; font-variant-numeric: tabular-nums;
  color: var(--label2); transition: color .15s; cursor: pointer; }
.wheel .col div.on { color: var(--label); font-weight: 600; }
.wheel .colon { position: relative; font-size: 24px; font-weight: 600; padding-bottom: 3px; }
.center { text-align: center; }
.optlist { max-height: 58dvh; overflow-y: auto; }
.optlist .row svg { color: var(--red); width: 20px; height: 20px; }
.value { color: var(--label2); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
form[data-kind=income] .only-expense,
form[data-kind=income] .k-expense, form[data-kind=expense] .k-income { display: none; }
.seg label { display: grid; place-items: center; border-radius: 999px; min-height: 36px; font-size: 14px; font-weight: 500; cursor: pointer; }
.seg input, .pick input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(:checked) { background: var(--glass-strong); font-weight: 600; box-shadow: var(--glass-shine), 0 3px 10px -2px #00000026, 0 0 0 .5px var(--glass-edge); }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 999px; font-size: 15px; cursor: pointer; box-shadow: var(--glass-shine), 0 2px 8px -2px #0000001A; transition: background .2s, color .2s; }
.pick:has(:checked) { background: var(--red-tint); color: var(--red); border-color: transparent; font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--red); }
.pick svg { width: 15px; height: 15px; }
.grip { width: 44px; height: 44px; margin-right: -12px; display: grid; place-items: center; color: var(--label2); touch-action: none; cursor: grab; }
.dragging { z-index: 1; background: var(--glass-strong); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 16px; box-shadow: 0 10px 28px #00000033; }
.dragging::before, .dragging + *::before { display: none; }
.swatches { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 4px 0; }
.sw { position: relative; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; box-shadow: inset 0 1px 0 #FFFFFF66; }
.sw input { position: absolute; opacity: 0; pointer-events: none; }
.sw:has(:checked) { outline: 2.5px solid currentColor; outline-offset: 2.5px; }
.kbd .pick:has(:focus-visible), .kbd .seg label:has(:focus-visible) { outline: 2px solid var(--red); outline-offset: 2px; }
dialog .sect { margin: 0 0 -6px; padding: 0 6px; }
dialog .group { background: var(--surface); }
.field { gap: 16px; }
.field > span { flex: none; }
.field input { flex: 1; min-width: 0; width: 100%; border: 0; background: none; text-align: right; padding: 0; appearance: none; -webkit-appearance: none; }
.field input::-webkit-date-and-time-value { text-align: right; }
.field input::placeholder, .bigfield::placeholder { color: var(--label2); opacity: .75; }
.bigfield { width: 100%; border: 0; border-radius: 999px; background: var(--fill); padding: 12px 18px; text-align: center; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pill.danger { color: var(--red); }
.pill.wide { width: 100%; }
#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); color: var(--label); padding: 10px 18px; border-radius: 999px; font-size: 15px; display: none; z-index: 5; white-space: nowrap; }
</style>
</head>
<body>
<div id="strip" aria-hidden="true"></div>
<div id="bg"></div>
<main id="main"><p class="empty">กำลังโหลด…</p></main>
<div class="dock">
<button class="ib tint add" onclick="S && editEntry()" aria-label="เพิ่มรายการ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<nav>

  <button data-tab="ana" onclick="go('ana')"><svg viewBox="0 0 24 24"><path d="M6 20v-6M12 20V4M18 20v-9"/></svg><span>วิเคราะห์</span></button>

// ---------- helpers ----------
const L = (th, en) => S.settings.lang === 'en' ? en : th;
const D = s => new Date(s.slice(0, 10) + 'T00:00:00Z'), iso = d => d.toISOString().slice(0, 10);
const addD = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const addM = (s, n) => { const d = D(s); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); return iso(d); };  // first day of that month
const today = () => new Date().toLocaleDateString('sv-SE', {timeZone: S.settings.tz});
const nowTs = () => today() + ' ' + new Date().toLocaleTimeString('sv-SE', {timeZone: S.settings.tz, hour: '2-digit', minute: '2-digit'});
const fd = (s, o = {day: 'numeric', month: 'short'}) => new Intl.DateTimeFormat(L('th-TH', 'en-GB'), {timeZone: 'UTC', ...o}).format(D(s));
const money = n => (n < 0 ? '-' : '') + S.settings.currency + Math.abs(n).toLocaleString('en-US', {maximumFractionDigits: 2});
const signed = (n, kind) => (kind === 'expense' ? '-' : '+') + money(n);
const cat = id => S.categories.find(c => c.id === id);
const catName = e => cat(e.category_id)?.name ?? L('ไม่มีหมวด', 'Uncategorised');
const catColor = id => { const c = cat(id); return c ? c.color || (c.kind === 'income' ? INCOME_COLOUR : PAL[S.categories.filter(x => x.kind === 'expense').indexOf(c) % PAL.length]) : '#A9A9B0'; };
const between = (from, to) => S.entries.filter(e => e.ts.slice(0, 10) >= from && e.ts.slice(0, 10) <= to);
const total = (list, kind) => list.reduce((a, e) => a + (e.kind === kind ? e.amount : 0), 0);
const opts = (list, sel) => list.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(sel ?? '') ? 'selected' : ''}>${esc(l)}</option>`).join('');
// a settings row that opens an option sheet; the lists live here so the row and the sheet agree
const CHOICES = {
  confirm: [['card', 'การ์ด'], ['text', 'ข้อความสั้น']],
  theme: [['auto', 'ตามเครื่อง'], ['light', 'สว่าง'], ['dark', 'มืด']],
  lang: [['th', 'ไทย'], ['en', 'English']],
  currency: [['฿', '฿ บาท'], ['$', '$ ดอลลาร์'], ['€', '€ ยูโร'], ['£', '£ ปอนด์'], ['¥', '¥ เยน'], ['₩', '₩ วอน']],
};
// [zone, Thai name, English name], from west to east
const TZ = [['America/Los_Angeles', 'ลอสแอนเจลิส', 'Los Angeles'], ['America/New_York', 'นิวยอร์ก', 'New York'], ['Europe/London', 'ลอนดอน', 'London'],
  ['Europe/Paris', 'ปารีส', 'Paris'], ['Europe/Berlin', 'เบอร์ลิน', 'Berlin'], ['Asia/Dubai', 'ดูไบ', 'Dubai'], ['Asia/Kolkata', 'อินเดีย', 'India'],
  ['Asia/Yangon', 'ย่างกุ้ง', 'Yangon'], ['Asia/Bangkok', 'กรุงเทพฯ', 'Bangkok'], ['Asia/Vientiane', 'เวียงจันทน์', 'Vientiane'],
  ['Asia/Phnom_Penh', 'พนมเปญ', 'Phnom Penh'], ['Asia/Ho_Chi_Minh', 'โฮจิมินห์', 'Ho Chi Minh City'], ['Asia/Jakarta', 'จาการ์ตา', 'Jakarta'],
  ['Asia/Singapore', 'สิงคโปร์', 'Singapore'], ['Asia/Kuala_Lumpur', 'กัวลาลัมเปอร์', 'Kuala Lumpur'], ['Asia/Manila', 'มะนิลา', 'Manila'],
  ['Asia/Hong_Kong', 'ฮ่องกง', 'Hong Kong'], ['Asia/Shanghai', 'จีน', 'China'], ['Asia/Taipei', 'ไทเป', 'Taipei'], ['Asia/Tokyo', 'โตเกียว', 'Tokyo'],
  ['Asia/Seoul', 'โซล', 'Seoul'], ['Australia/Sydney', 'ซิดนีย์', 'Sydney']];
const tzOffset = z => { try { return new Intl.DateTimeFormat('en-US', {timeZone: z, timeZoneName: 'shortOffset'}).formatToParts(new Date()).find(p => p.type === 'timeZoneName').value; } catch { return ''; } };
const tzCity = z => { const t = TZ.find(([v]) => v === z); return t ? L(t[1], t[2]) : z.split('/').pop().replace(/_/g, ' '); };
// a zone set before this list existed stays at the top so it still shows as chosen
const tzChoices = () => [...new Set([S.settings.tz, ...TZ.map(([z]) => z)])].filter(tzOffset)
  .sort((a, b) => (TZ.findIndex(([z]) => z === a) + 1 || -1) - (TZ.findIndex(([z]) => z === b) + 1 || -1)).map(z => [z, tzCity(z), null, tzOffset(z)]);
const choices = k => typeof CHOICES[k] === 'function' ? CHOICES[k]() : CHOICES[k];
const settingLabel = k => k === 'tz' ? `${tzCity(S.settings.tz)} (${tzOffset(S.settings.tz)})` : choices(k).find(([v]) => v === S.settings[k])?.[1] ?? S.settings[k];
const pick = (k, title) => `<button class="row tap" onclick="chooseSetting('${k}', '${title}')"><span class="grow">${title}</span>
  <span class="value">${esc(settingLabel(k))}</span>${CHEV}</button>`;
async function chooseSetting(k, title) {
  const v = await pickOption(title, k === 'tz' ? tzChoices() : choices(k), S.settings[k]);
  if (v !== null && v !== S.settings[k]) setS({[k]: v});
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// the summary cycle: starts on settings.cycle_day, clamped to the month's length
const cycStart = m => m.slice(0, 8) + String(Math.min(S.settings.cycle_day, +addD(addM(m, 1), -1).slice(8))).padStart(2, '0');
function cycle(off) {
  const t = today(), m0 = t.slice(0, 8) + '01', m = addM(m0, (t >= cycStart(m0) ? 0 : -1) + off);
  return {from: cycStart(m), to: addD(cycStart(addM(m, 1)), -1)};
}
const cycleLabel = c => S.settings.cycle_day === 1 ? fd(c.from, MONTH) : `${fd(c.from)} – ${fd(c.to, FULL)}`;
function range() {  // the entries tab's current date range
  const f = ui.f, t = today();
  return f.mode === 'month' ? cycle(f.off) : f.mode === 'custom' ? {from: f.from, to: f.to} : {from: addD(t, 1 - f.mode), to: t};
}
function catRows(list) {  // [name, total, colour] for every expense category, biggest spend first; id 0 = category was deleted
  const m = new Map();
  for (const e of list) if (e.kind === 'expense') { const k = cat(e.category_id) ? e.category_id : 0; m.set(k, (m.get(k) || 0) + e.amount); }
  return S.categories.filter(c => c.kind === 'expense').map(c => [c.name, m.get(c.id) || 0, catColor(c.id)])
    .concat(m.get(0) ? [[L('ไม่มีหมวด', 'Uncategorised'), m.get(0), '#A9A9B0']] : []).sort((a, b) => b[1] - a[1]);
}
function channelRows(list) {  // spending per payment channel
  const by = new Map();
  for (const e of list) if (e.kind === 'expense') {
    const k = S.channels.some(c => c.id === e.channel_id) ? e.channel_id : 0;
    by.set(k, (by.get(k) || 0) + e.amount);
  }
  const of = type => S.channels.filter(c => (c.type || 'other') === type), sum = cs => cs.reduce((a, c) => a + (by.get(c.id) || 0), 0);
  const line = (name, amount, sub) => `<div class="row ${sub ? 'subrow' : ''}"><span class="grow">${name}</span><${sub ? 'span' : 'b'} class="num">${money(amount)}</${sub ? 'span' : 'b'}></div>`;
  return line('เงินสด', sum(of('cash'))) + line('บัตรเครดิต', sum(of('card'))) + of('card').map(c => line(esc(c.name), by.get(c.id) || 0, 1)).join('')
    + of('other').map(c => line(esc(c.name), by.get(c.id) || 0)).join('') + (by.get(0) ? line('ไม่ระบุ', by.get(0)) : '');
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2500); }
function translate(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n; (n = w.nextNode());) { const k = n.nodeValue.trim(); if (EN[k]) n.nodeValue = n.nodeValue.replace(k, EN[k]); }
}
function chart(id, type, labels, datasets, options = {}) {
  if (window.Chart) after.push(() => charts.push(new Chart($('#' + id), {type, data: {labels, datasets}, options})));
  return `<canvas id="${id}"></canvas>`;
}
const donut = (id, all) => { const sum = all.reduce((a, r) => a + r[1], 0), rows = all.filter(r => r[1] >= sum * .02);  // under 2% draws as a stray line
  return chart(id, 'doughnut', rows.map(r => r[0]),
  [{data: rows.map(r => r[1]), backgroundColor: rows.map(r => r[2]), borderWidth: 0, borderRadius: 7, spacing: 3}],
  {cutout: '66%', plugins: {legend: {display: false}, tooltip: {displayColors: false, callbacks: {label: c => money(c.parsed)}}}}); };

// ---------- shared pieces ----------
const title = (text, acts = '') => `<div class="title"><h1>${text}</h1></div><div class="acts">${acts}</div>`;
const seg = (items, cur, js) => `<div class="seg">${items.map(([v, l]) => `<button class="${v === cur ? 'on' : ''}" onclick="${js(v)}">${l}</button>`).join('')}</div>`;
const stepper = (label, prev, next, last) => `<div class="stepper"><button class="ib" onclick="${prev}" aria-label="previous">${I.chevL}</button>
  <b>${label}</b><button class="ib" onclick="${next}" ${last ? 'disabled' : ''} aria-label="next">${I.chevR}</button></div>`;
const catList = rows => { const sum = rows.reduce((a, r) => a + r[1], 0) || 1; return rows.map(r =>
  `<div class="row"><i class="dot" style="background:${r[2]}"></i><span class="grow">${esc(r[0])}</span><span class="sub num">${(r[1] / sum * 100).toFixed(0)}%</span><b class="num">${money(r[1])}</b></div>`).join(''); };
const row = e => {
  const ch = S.channels.find(c => c.id === e.channel_id);
  return `<div class="row tap" onclick="tapEntry(${e.id})">
    ${ui.sel ? `<span class="check ${ui.sel.has(e.id) ? 'on' : ''}">${I.check}</span>` : `<i class="dot" style="background:${catColor(e.category_id)}"></i>`}
    <div class="grow"><div>${esc(e.note || catName(e))}</div><div class="sub">${e.ts.slice(11)} · ${esc(catName(e))}${ch ? ' · ' + esc(ch.name) : ''} ${e.memory ? I.bulb.replace('<svg', '<svg class="inline-icon"') : ''}</div></div>
    <div class="num amt ${e.kind}">${signed(e.amount, e.kind)}</div></div>`;
};
function days(list) {
  const g = new Map();
  for (const e of list) { const d = e.ts.slice(0, 10); g.has(d) || g.set(d, []); g.get(d).push(e); }
  return [...g].map(([d, es]) => {
    const net = total(es, 'income') - total(es, 'expense');
    return `<div class="sect"><span>${fd(d, {weekday: 'short', day: 'numeric', month: 'short'})}</span><span class="num">${net > 0 ? '+' : ''}${money(net)}</span></div><div class="group">${es.map(row).join('')}</div>`;
  }).join('');
}
const tr = s => S.settings.lang === 'en' && EN[s] || s;

    const days = [...Array(last)].map((_, i) => {

// An hour and a minute. Resolves to 'HH:MM', '' (switched off) or null. (The reminder still goes out on the next 5-minute cron run.)
function pickTime(value, title = 'เวลาเตือน', canOff = true) {
  const [h, m] = (value || '20:00').split(':'), pad = i => String(i).padStart(2, '0');
  Object.assign(PK, {h, m});
  const col = (n, k) => `<div class="col" data-k="${k}">${[...Array(n)].map((_, i) =>
    `<div class="${pad(i) === PK[k] ? 'on' : ''}" onclick="this.parentElement.scrollTo({top: ${i * 44}, behavior: 'smooth'})">${pad(i)}</div>`).join('')}</div>`;
  const done = picker(() => `<b class="center">${title}</b>
    <div class="wheel"><div class="band"></div>${col(24, 'h')}<span class="colon">:</span>${col(60, 'm')}</div>
    <div class="two"><button type="button" class="pill" onclick="PK.done(null)">ยกเลิก</button><button type="button" class="pill tint" onclick="PK.done(PK.h + ':' + PK.m)">ตกลง</button></div>
    ${canOff && value ? `<button type="button" class="link center" onclick="PK.done('')">ปิดการเตือน</button>` : ''}`);
  // the sheet is open now: roll each column to its value, and follow it as it scrolls
  document.querySelectorAll('#pick .col').forEach(c => {
    c.scrollTop = +PK[c.dataset.k] * 44;
    c.onscroll = () => {
      const i = Math.max(0, Math.min(c.children.length - 1, Math.round(c.scrollTop / 44)));
      PK[c.dataset.k] = pad(i);
      [...c.children].forEach((el, j) => el.classList.toggle('on', j === i));
    };
  });

}

// Drag a category row by its grip; the new order is saved when the finger lifts.
function drag(ev, grip) {
  const el = grip.closest('.row'), group = el.parentElement, h = el.offsetHeight, y0 = ev.clientY;
  const others = () => [...group.querySelectorAll('[data-id]')].filter(r => r !== el);
  const i0 = [...group.querySelectorAll('[data-id]')].indexOf(el);
  let cur = i0;
  grip.setPointerCapture(ev.pointerId);
  el.classList.add('dragging');
  grip.onpointermove = e => {
    const dy = e.clientY - y0, to = Math.max(0, Math.min(others().length, i0 + Math.round(dy / h)));
    if (to !== cur) { group.insertBefore(el, others()[to] || group.lastElementChild); cur = to; }
    el.style.transform = `translateY(${dy - (cur - i0) * h}px)`;
  };
  grip.onpointerup = grip.onpointercancel = async () => {
    grip.onpointermove = grip.onpointerup = grip.onpointercancel = null;
    el.classList.remove('dragging');
    el.style.transform = '';
    const ids = [...group.querySelectorAll('[data-id]')].map(r => +r.dataset.id);
    for (const [n, id] of ids.entries()) if (cat(id).sort !== n) await api('PUT', 'categories/' + id, {sort: n});
    load();
  };
}

async function exportCsv() {
  const t = today(), view = range(), c0 = cycle(0), year = t.slice(0, 4);
  const periods = {c0, c1: cycle(-1), c3: {from: cycle(-2).from, to: c0.to}, year: {from: year + '-01-01', to: year + '-12-31'}, all: {from: '0000', to: '9999'}};
  const viewing = view.from === c0.from && view.to === c0.to ? 'c0' : 'custom';  // start from what the entries tab shows
  const r = await ask('ส่งออกรายการ', [
    {k: 'cat', type: 'chips', label: 'หมวดหมู่', value: '', options: [['', L('ทุกหมวดหมู่', 'All categories')], ...S.categories.map(c => [c.id, c.name, catColor(c.id)])]},
    {k: 'period', type: 'chips', label: 'ช่วงเวลา', value: viewing, options: [['c0', cycleLabel(c0)], ['c1', cycleLabel(periods.c1)], ['c3', L('3 เดือนล่าสุด', 'Last 3 months')],
      ['year', L('ปีนี้', 'This year')], ['all', L('ทั้งหมด', 'All time')], ['custom', L('กำหนดเอง', 'Custom')]]},
    {k: 'range', type: 'range', label: 'ช่วงวันที่', value: view, cls: 'only-custom'},
    {k: 'col', type: 'checks', label: 'คอลัมน์', options: COLS},
    {k: 'format', type: 'chips', label: 'ประเภทไฟล์', value: 'xlsx', options: [['xlsx', 'Excel (.xlsx)'], ['csv', 'CSV (.csv)']]},
  ], {cta: 'สร้างไฟล์ส่งออก', sub: 'เลือกข้อมูลที่ต้องการ แล้วป้าคีนจะเตรียมไฟล์ให้จ้ะ'});
  if (!r) return;
  const cols = COLS.filter(([k]) => r['col_' + k]), typed = cols.some(c => c[0] === 'type');
  if (!cols.length) return toast(L('เลือกอย่างน้อย 1 คอลัมน์นะจ๊ะ', 'Pick at least one column'));
  const {from, to} = periods[r.period] || {from: r.from || '0000', to: r.to || '9999'};
  const list = between(from, to).filter(e => !r.cat || e.category_id === +r.cat);
  const cell = {
    date: e => e.ts, type: e => tr(e.kind === 'expense' ? 'รายจ่าย' : 'รายรับ'), note: e => e.note, category: catName,
    amount: e => typed || e.kind === 'income' ? e.amount : -e.amount,  // without a type column, expenses go negative
    channel: e => S.channels.find(c => c.id === e.channel_id)?.name,
  };
  const rows = [cols.map(c => tr(c[1])), ...list.map(e => cols.map(c => cell[c[0]](e) ?? ''))];
  const name = `paakeen-${r.period === 'all' ? 'all' : from + '_' + to}`;
  let file;
  if (r.format === 'csv') {
    // quote everything; a leading ' stops spreadsheet apps running a text cell as a formula
    const q = v => `"${String(v).replace(/^[=+\-@]/, typeof v === 'number' ? '$&' : "'$&").replace(/"/g, '""')}"`;
    file = new File(['﻿' + rows.map(row => row.map(q).join(',')).join('\n')], name + '.csv', {type: 'text/csv'});
  } else {
    // the spreadsheet library is only loaded when someone asks for Excel; cells stay plain text or numbers, never formulas
    if (!window.XLSX) await new Promise((ok, fail) => document.head.append(Object.assign(document.createElement('script'),
      {src: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.mini.min.js', onload: ok, onerror: () => fail(toast(L('โหลดตัวสร้างไฟล์ Excel ไม่ได้ ลองใหม่หรือเลือก CSV', 'Could not load the Excel maker. Try again or pick CSV.')))})));
    const book = XLSX.utils.book_new(), sheet = XLSX.utils.aoa_to_sheet(rows);
    sheet['!cols'] = cols.map(c => ({wch: c[0] === 'note' ? 28 : 14}));
    XLSX.utils.book_append_sheet(book, sheet, 'ป้าคีน');
    file = new File([XLSX.write(book, {bookType: 'xlsx', type: 'array'})], name + '.xlsx', {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  }
  if (navigator.canShare?.({files: [file]})) return navigator.share({files: [file]}).catch(() => {});
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click();
}
const shift = n => U({month: addM(ui.month + '-01', n).slice(0, 7)});

// ---------- views ----------
const VIEWS = {
  sum() {
    const c = cycle(ui.sumOff), list = between(c.from, c.to), exp = total(list, 'expense'), inc = total(list, 'income');
    const rows = catRows(list), used = rows.filter(r => r[1]);
    return `${title('สรุป', S.user.picture ? `<img class="avatar" src="${esc(S.user.picture)}" alt="${esc(S.user.name)}">` : '')}
    ${stepper(cycleLabel(c), 'U({sumOff: ui.sumOff - 1})', 'U({sumOff: ui.sumOff + 1})', ui.sumOff >= 0)}
    <div class="group">
      <div class="pad"><div class="sub">เหลือเก็บ</div><div class="big num ${inc < exp ? 'expense' : ''}">${money(inc - exp)}</div></div>
      <div class="split"><div><div class="sub">รายรับ</div><div class="mid num income">${money(inc)}</div></div>
        <div><div class="sub">รายจ่าย</div><div class="mid num expense">${money(exp)}</div></div></div>
    </div>
    <div class="sect"><span>รายจ่ายตามหมวด</span><span>${list.length} ${L('รายการ', list.length === 1 ? 'entry' : 'entries')}</span></div>
    <div class="group">
      ${used.length ? `<div class="donut">${donut('donut', used)}</div>` : '<p class="empty">ยังไม่มีรายจ่ายในช่วงนี้</p>'}
      ${catList(ui.sumOpen ? rows : used)}
      <button class="row tap center link" onclick="U({sumOpen: ${!ui.sumOpen}})">${ui.sumOpen ? 'ย่อ' : 'ดูทุกหมวด'}</button>
    </div>
    ${S.channels.length ? `<div class="sect"><span>ยอดตามช่องทาง</span></div><div class="group">${channelRows(list)}</div>` : ''}
    ${S.entries.length ? `<div class="sect"><b>รายการล่าสุด</b><button class="link" onclick="go('list')">ดูทั้งหมด</button></div>${days(S.entries.slice(0, 7))}` : ''}`;
  },

  ana() {
    const now = today().slice(0, 7), months = [...Array(6)].map((_, i) => addM(ui.month + '-01', i - 5).slice(0, 7));
    const inMonth = m => S.entries.filter(e => e.ts.startsWith(m)), ml = m => fd(m + '-01', {month: 'short'});
    const first = S.entries.at(-1)?.ts.slice(0, 7) || now;
    const n = Math.max(1, (now.slice(0, 4) - first.slice(0, 4)) * 12 + (now.slice(5) - first.slice(5)) + 1);
    const exp = L('รายจ่าย', 'Expense'), inc = L('รายรับ', 'Income');
    const base = {plugins: {legend: {position: 'bottom', labels: {usePointStyle: true, pointStyle: 'circle', boxHeight: 7}}},
      scales: {x: {grid: {display: false}}, y: {border: {display: false}, ticks: {maxTicksLimit: 5, callback: v => v >= 1000 ? v / 1000 + 'k' : v}}}};
    let history, stats = `<div class="split"><div><div class="sub">รายจ่ายเฉลี่ยต่อเดือน</div><div class="mid num expense">${money(Math.round(total(S.entries, 'expense') / n))}</div></div>
        <div><div class="sub">รายรับเฉลี่ยต่อเดือน</div><div class="mid num income">${money(Math.round(total(S.entries, 'income') / n))}</div></div></div>`;
    if (ui.mode === 'month') {
      history = chart('hist', 'bar', months.map(ml), [{label: exp, data: months.map(m => total(inMonth(m), 'expense')), backgroundColor: css('--expense'), borderRadius: 5, maxBarThickness: 16},
        {label: inc, data: months.map(m => total(inMonth(m), 'income')), backgroundColor: css('--income'), borderRadius: 5, maxBarThickness: 16}],
        {...base, plugins: {...base.plugins, tooltip: {displayColors: false}}});  // no colour squares in the tap label
    } else {
      // one kind per day as bars (the dashed daily-average line is for spending only); expense and income are switched, not mixed,
      // since one payday would flatten every other day
      const k = ui.dayKind, out = k === 'expense', name = out ? exp : inc;
      const last = +addD(addM(ui.month + '-01', 1), -1).slice(8), list = inMonth(ui.month), day = i => ui.month + '-' + String(i + 1).padStart(2, '0');
      const per = kind => [...Array(last)].map((_, i) => total(list.filter(e => e.ts.startsWith(day(i))), kind));
      const sum = kind => per(kind).reduce((a, v) => a + v, 0), data = per(k);
      const days = ui.month === now ? +today().slice(8) : last, avg = sum('expense') / days, t = today();
      history = !sum(k) ? `<p class="empty">${out ? 'ยังไม่มีรายจ่ายในเดือนนี้' : 'ยังไม่มีรายรับในเดือนนี้'}</p>` : chart('hist', 'bar', data.map((_, i) => i + 1), [
        ...(out ? [{type: 'line', label: L('เฉลี่ยต่อวัน', 'Daily average'), data: data.map(() => avg), borderColor: css('--label2'), borderDash: [4, 4], borderWidth: 1.5, pointRadius: 0, order: 0}] : []),
        {label: name, data, backgroundColor: data.map((_, i) => day(i) === t && out ? css('--red') : css('--' + k)), borderRadius: 4, barPercentage: .7, categoryPercentage: 1, order: 1}],
        {aspectRatio: 1.6, plugins: {legend: {display: false}, tooltip: {filter: c => c.dataset.type !== 'line', displayColors: false,
          callbacks: {title: c => fd(day(c[0].dataIndex), FULL), label: c => `${name} ${money(c.raw)}`}}},
        scales: {x: {grid: {display: false}, ticks: {autoSkip: false, maxRotation: 0, callback: (v, i) => i === 0 || (i + 1) % 5 === 0 ? i + 1 : ''}},
          y: base.scales.y}});
      history = `<div style="margin: -4px 2px 14px">${seg([['expense', 'รายจ่าย'], ['income', 'รายรับ']], k, v => `U({dayKind: '${v}'})`)}</div>${history}`;
      stats = `<div class="split three"><div><div class="sub">${exp}</div><div class="mid num expense">${money(sum('expense'))}</div></div>
        <div><div class="sub">${inc}</div><div class="mid num income">${money(sum('income'))}</div></div>
        <div><div class="sub">${L('เฉลี่ยต่อวัน', 'Daily avg.')} <span class="dash"></span></div><div class="mid num">${money(Math.round(avg))}</div></div></div>`;
    }
    const withData = [...new Set(S.entries.map(e => e.ts.slice(0, 7)))];
    const pie = ui.pie || today().slice(0, 7), rows = catRows(pie === 'all' ? S.entries : inMonth(pie)).filter(r => r[1]);
    const label = ui.mode === 'month' ? `${ml(months[0])} – ${fd(ui.month + '-01', {month: 'short', year: 'numeric'})}` : fd(ui.month + '-01', MONTH);
    return `${title('วิเคราะห์')}
    ${seg([['month', 'รายเดือน'], ['day', 'รายวัน']], ui.mode, v => `U({mode: '${v}'})`)}
    ${stepper(label, 'shift(-1)', 'shift(1)', ui.month >= now)}
    <div class="group"><div class="chart">${history}</div>${stats}</div>
    <div class="sect"><span>รายจ่ายตามหมวด</span><button class="link" style="font-size:15px" onclick="choosePie()">${pie === 'all' ? L('สะสม', 'All time') : fd(pie + '-01', MONTH)} ▾</button></div>
    <div class="group">${rows.length ? `<div class="donut">${donut('pie', rows)}</div>${catList(rows)}` : '<p class="empty">ยังไม่มีรายจ่ายในช่วงนี้</p>'}</div>`;
  },

  bud() {
    const cats = S.categories.filter(c => c.kind === ui.kind);
    return `${title('หมวดหมู่', `<button class="pill ${ui.sort ? 'on' : ''}" onclick="U({sort: ${!ui.sort}})">${ui.sort ? 'เสร็จ' : 'จัดเรียง'}</button>`)}
    ${seg([['expense', 'รายจ่าย'], ['income', 'รายรับ']], ui.kind, v => `U({kind: '${v}'})`)}
    <div class="group">
      ${cats.map(c => ui.sort
        ? `<div class="row" data-id="${c.id}"><i class="dot" style="background:${catColor(c.id)}"></i><span class="grow">${esc(c.name)}</span>
            <button class="grip" onpointerdown="drag(event, this)" onkeydown="event.key === 'ArrowUp' ? move(${c.id}, -1) : event.key === 'ArrowDown' && move(${c.id}, 1)" aria-label="${L('ลากเพื่อจัดเรียง', 'Drag to reorder')}">${I.grip}</button></div>`
        : `<button class="row tap" onclick="editCat(${c.id})"><i class="dot" style="background:${catColor(c.id)}"></i><span class="grow">${esc(c.name)}</span>${CHEV}</button>`).join('')}
      <button class="row tap link" onclick="editCat()">${I.plus}<span>เพิ่มหมวด</span></button>
    </div>
    ${ui.sort ? '<p class="foot">ลากที่ขีดสามขีดด้านขวาเพื่อจัดเรียง</p>' : ''}
    <div class="sect"><span>รอบสรุป</span></div>
    <div class="group"><button class="row tap" onclick="setCycle()"><span class="grow">วันเริ่มรอบ</span><span class="muted">${L('วันที่', 'Day')} ${S.settings.cycle_day}</span>${CHEV}</button></div>
    <p class="foot">รอบสรุปและรายการจะนับจากวันนี้ของทุกเดือน เดือนที่สั้นกว่าจะเริ่มที่วันสุดท้ายของเดือน</p>`;
  },

  list() {
    const f = ui.f, list = filtered(), cats = f.kind === 'all' ? [] : S.categories.filter(c => c.kind === f.kind);
    const chip = (on, js, label) => `<button class="chip ${on ? 'on' : ''}" onclick="${js}">${label}</button>`;
    const n = ui.sel?.size;
    return `${title('รายการ', ui.sel
      ? `<button class="pill" onclick="U({sel: new Set(filtered().map(e => e.id))})">เลือกทั้งหมด</button><button class="ib" onclick="U({sel: null})" aria-label="${L('เสร็จ', 'Done')}">${I.check}</button>`
      : `<div class="cluster"><button onclick="U({sel: new Set()})" aria-label="${L('เลือก', 'Select')}">${I.select}</button>
        <button onclick="exportCsv()" aria-label="${L('ส่งออก', 'Export')}">${I.share}</button></div>`)}
    ${ui.sel ? `<div class="selbar"><span class="grow">${L(`${n} รายการ`, `${n} selected`)}</span>
      <button onclick="bulkCat()" ${n ? '' : 'disabled'}>${I.tag}<span>เปลี่ยนหมวด</span></button>
      <button class="expense" onclick="bulkDel()" ${n ? '' : 'disabled'}>${I.trash}<span>ลบ</span></button></div>` : ''}
    ${seg([['all', 'ทั้งหมด'], ['expense', 'รายจ่าย'], ['income', 'รายรับ']], f.kind, v => `F({kind: '${v}', cat: null})`)}
    ${seg([['month', 'เดือน'], ['7', '7 วัน'], ['14', '14 วัน'], ['custom', 'กำหนดเอง']], f.mode, v => `F({mode: '${v}'})`)}
    ${f.mode === 'month' ? stepper(cycleLabel(cycle(f.off)), 'F({off: ui.f.off - 1})', 'F({off: ui.f.off + 1})', f.off >= 0) : ''}
    ${f.mode === 'custom' ? `<div class="group"><button class="row tap" onclick="listRange()"><span class="grow">ช่วงวันที่</span><span class="muted">${rangeText(f.from, f.to)}</span>${CHEV}</button></div>` : ''}
    ${cats.length ? `<div class="chips">${chip(!f.cat, 'F({cat: null})', 'ทั้งหมด')}${cats.map(c => chip(f.cat === c.id, `F({cat: ${c.id}})`, esc(c.name))).join('')}</div>` : ''}
    ${days(list) || '<p class="empty">ยังไม่มีรายการในช่วงนี้ พิมพ์บอกป้าคีนใน LINE หรือกด + เพื่อจดเอง</p>'}`;
  },

  set() {
    const s = S.settings, tog = k => `<input class="switch" type="checkbox" role="switch" ${s[k] ? 'checked' : ''} onchange="setS({${k}: this.checked})">`;
    const freq = {daily: 'ทุกวัน', weekly: 'ทุกสัปดาห์', monthly: 'ทุกเดือน'};
    const chans = keep => S.channels.filter(keep).map(c => `<div class="row"><span class="grow">${esc(c.name)}</span>${x('channels/' + c.id)}</div>`).join('');
    const x = path => `<button class="ib small" onclick="del('${path}')" aria-label="${L('ลบ', 'Delete')}">${I.x}</button>`;
    return `${title('ตั้งค่า')}
    <div class="group"><div class="row">${S.user.picture ? `<img class="avatar" style="width:52px;height:52px" src="${esc(S.user.picture)}" alt="">` : ''}
      <div class="grow"><div style="font-size:20px;font-weight:600">${esc(S.user.name || 'ป้าคีน')}</div><div class="sub">${S.entries.length} ${L('รายการ', 'entries')}</div></div></div></div>

    <div class="sect"><span>การจด</span></div>
    <div class="group">
      <button class="row tap" onclick="go('bud')"><span class="grow">หมวดหมู่</span>${CHEV}</button>
      <label class="row"><span class="grow">จัดหมวดด้วยความจำ</span>${tog('memory')}</label>
      ${pick('confirm', 'ข้อความยืนยันหลังจด')}
    </div>
    <p class="foot">ป้าจะจัดหมวดตามรายการเก่าๆ ที่หลานเคยจด</p>

    <div class="sect"><span>จดประจำ</span></div>
    <div class="group">
      ${S.recurring.map(r => `<div class="row"><div class="grow"><div>${esc(r.note || catName(r))}</div><div class="sub">${freq[r.freq]}</div></div><span class="num amt ${r.kind}">${signed(r.amount, r.kind)}</span>${x('recurring/' + r.id)}</div>`).join('')}
      <button class="row tap link" onclick="addRecurring()">${I.plus}<span>เพิ่มรายการจดประจำ</span></button>
    </div>

    <div class="sect"><span>ช่องทางชำระเงิน</span><span>${S.channels.length}/10</span></div>
    <div class="group">
      <label class="row"><span class="grow">ติดตามช่องทางชำระเงิน</span>${tog('track_channel')}</label>
      ${chans(c => c.type !== 'card')}
      ${S.channels.length < 10 ? `<button class="row tap link" onclick="addChannel('other')">${I.plus}<span>เพิ่มช่องทาง</span></button>` : ''}
    </div>
    <p class="foot">ป้าจะจับคู่ช่องทางจากข้อความ เสียง รูป หรือ PDF และจะถามเฉพาะตอนที่ไม่แน่ใจ</p>

    <div class="sect"><span>บัตรเครดิต</span></div>
    <div class="group">
      ${chans(c => c.type === 'card')}
      ${S.channels.length < 10 ? `<button class="row tap link" onclick="addChannel('card')">${I.plus}<span>เพิ่มบัตรเครดิต</span></button>` : ''}
    </div>
    <p class="foot">สลิปที่ส่งมาจะจดเป็นเงินสด ป้าจะถามชื่อรายการ แล้วจัดหมวดให้เองจากชื่อ</p>

    <div class="sect"><span>การแจ้งเตือน</span></div>
    <div class="group"><button class="row tap" onclick="setRemind()"><span class="grow">เตือนจดประจำวัน</span><span class="muted">${s.remind || L('ปิด', 'Off')}</span>${CHEV}</button></div>
    <p class="foot">ป้าจะทักมาเตือนตามเวลานี้ ถ้าวันนั้นยังไม่ได้จดอะไร</p>

    <div class="sect"><span>ทั่วไป</span></div>
    <div class="group">
      ${pick('theme', 'ธีม')}
      ${pick('lang', 'ภาษา')}
      ${pick('currency', 'สกุลเงิน')}
      ${pick('tz', 'โซนเวลา')}
    </div>
    <div class="group" style="margin-top:12px"><button class="row tap center expense" onclick="wipe()">ลบรายการทั้งหมด</button></div>`;
  },
};

load().then(() => {
  ui.month = today().slice(0, 7);
  Object.assign(ui.f, cycle(0));
  render();
  if (hash.get('tab') in VIEWS) go(hash.get('tab'));  // the chat menu's tiles
  if (hash.get('add')) editEntry();
  if (hash.get('edit')) editEntry(+hash.get('edit'));
});
