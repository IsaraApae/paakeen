<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6E4E3" media="(prefers-color-scheme: light)">  <!-- --top-solid; a script adds a third tag only for a picked theme opposite the phone's -->
<meta name="theme-color" content="#200905" media="(prefers-color-scheme: dark)">
<title>Test D</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="any">  <!-- ?v= makes browsers drop an icon (or "no icon") they cached; bump it when the icon changes -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">  <!-- iPhone browsers take the page icon from this -->
<link rel="manifest" href="/manifest.webmanifest">
  <!-- async: the page and data load alongside it -->
<style>
/* Liquid Glass: controls and navigation float as translucent glass above an opaque content layer */
:root {
  color-scheme: light dark;
  --bg: #F5F3F7; --surface: #FFFFFFBF; --fill: #7676801F; --track: #78788029;
  --label: #1C1C1E; --label2: #636366; --sep: #3C3C4338;
  /* the same red and green as dark mode, so both themes match */
  --red: #FF6961; --red-tint: #FF696126; --expense: #F0958E; --income: #8FD3A0; --switch: #34C759;
  --expense-text: #C24A44; --income-text: #35805A;  /* amounts stay darker on the light background so they read clearly */
  --wash: radial-gradient(70% 38% at 8% 0%, #FF3B3038, transparent 72%), radial-gradient(60% 34% at 100% 14%, #FF9F0A33, transparent 72%), radial-gradient(60% 34% at 0% 62%, #AF52DE1F, transparent 72%), radial-gradient(80% 40% at 70% 100%, #FF2D552E, transparent 72%);
  --glass: #FFFFFF8C; --glass-strong: #FFFFFFC7; --glass-edge: #FFFFFFB3;
  --glass-shine: inset 0 1px 0 #FFFFFFE6, inset 0 -1px 0 #FFFFFF40;
  --glass-shadow: 0 10px 30px -6px #00000026, 0 2px 6px #0000000F;
  --sheet: #F2F2F7CC; --dim: #00000033;
  --top-solid: #F6E4E3;  /* LINE fills the strip behind the clock with this one colour (theme-color); #bg starts in it */
}
/* dark: follows the device unless the theme setting says light or dark */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #000000; --surface: #1C1C1EBF; --fill: #7676803D; --track: #78788052;
    --label: #F2F2F7; --label2: #A1A1A8; --sep: #54545899;
    --red: #FF6961; --red-tint: #FF696126; --expense: #F0958E; --income: #8FD3A0; --expense-text: #F0958E; --income-text: #8FD3A0;
    --wash: radial-gradient(70% 38% at 8% 0%, #FF3B3052, transparent 72%), radial-gradient(60% 34% at 100% 14%, #FF9F0A2E, transparent 72%), radial-gradient(60% 34% at 0% 62%, #5E5CE63D, transparent 72%), radial-gradient(80% 40% at 70% 100%, #FF2D5547, transparent 72%);
    --glass: #3A3A3C80; --glass-strong: #636366B3; --glass-edge: #FFFFFF24;
    --glass-shine: inset 0 1px 0 #FFFFFF2E, inset 0 -1px 0 #FFFFFF0F;
    --glass-shadow: 0 10px 30px -6px #00000080, 0 2px 6px #00000040;
    --sheet: #1C1C1ECC; --dim: #00000066;
    --top-solid: #200905;
  }
}
:root[data-theme=dark] {
  --bg: #000000; --surface: #1C1C1EBF; --fill: #7676803D; --track: #78788052;
  --label: #F2F2F7; --label2: #A1A1A8; --sep: #54545899;
  --red: #FF6961; --red-tint: #FF696126; --expense: #F0958E; --income: #8FD3A0; --expense-text: #F0958E; --income-text: #8FD3A0;
  --wash: radial-gradient(70% 38% at 8% 0%, #FF3B3052, transparent 72%), radial-gradient(60% 34% at 100% 14%, #FF9F0A2E, transparent 72%), radial-gradient(60% 34% at 0% 62%, #5E5CE63D, transparent 72%), radial-gradient(80% 40% at 70% 100%, #FF2D5547, transparent 72%);
  --glass: #3A3A3C80; --glass-strong: #636366B3; --glass-edge: #FFFFFF24;
  --glass-shine: inset 0 1px 0 #FFFFFF2E, inset 0 -1px 0 #FFFFFF0F;
  --glass-shadow: 0 10px 30px -6px #00000080, 0 2px 6px #00000040;
  --sheet: #1C1C1ECC; --dim: #00000066;
  --top-solid: #200905;
}
:root[data-theme=light] { color-scheme: light; }
:root[data-theme=dark] { color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
::selection { background: var(--red-tint); }
html { -webkit-text-size-adjust: 100%; background: var(--top-solid); }
body {
  margin: 0; color: var(--label); caret-color: var(--red); accent-color: var(--red);
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Sukhumvit Set", Thonburi, system-ui, sans-serif;
  padding-bottom: calc(104px + env(safe-area-inset-bottom));
}
#bg { position: fixed; inset: 0; z-index: -1; background: linear-gradient(var(--top-solid), transparent 120px),
  linear-gradient(transparent calc(100% - 120px), var(--top-solid)), var(--wash), var(--bg); }  /* starts and ends in the strip colour */
/* LINE's iPhone browser fills the strips behind the clock and behind its bottom address bar with the theme colour,
   and while scrolling draws only scrolling content there, never the fixed #bg. #strip scrolls with the page under #bg
   in that same colour, which is also where #bg starts and ends, so both edges blend into the background. */
body { position: relative; min-height: 100vh; }
/* content softens as it scrolls behind the menu bar: a progressive blur from stacked, unmasked layers (LINE's iPhone
   browser ignores a backdrop blur that has a mask), each shorter and stronger toward the bottom; translateZ keeps it
   on its own layer above the cards and charts */
.blur-bottom { position: fixed; left: 0; right: 0; bottom: 0; height: calc(env(safe-area-inset-bottom) + 96px); z-index: 2; pointer-events: none; transform: translateZ(0); }
.blur-bottom i { position: absolute; left: 0; right: 0; bottom: 0; -webkit-backdrop-filter: blur(var(--b)); backdrop-filter: blur(var(--b)); }
.blur-bottom i:nth-child(1) { height: 100%; --b: .5px; } .blur-bottom i:nth-child(2) { height: 80%; --b: 1px; }
.blur-bottom i:nth-child(3) { height: 62%; --b: 2px; } .blur-bottom i:nth-child(4) { height: 45%; --b: 4px; }
.blur-bottom i:nth-child(5) { height: 30%; --b: 8px; } .blur-bottom i:nth-child(6) { height: 16%; --b: 14px; }
#strip { position: absolute; inset: 0; z-index: -2; background: var(--top-solid); }
main { max-width: 560px; margin: 0 auto; padding: calc(56px + env(safe-area-inset-top)) 16px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
h1 { margin: 0; font-size: 32px; line-height: 1.25; font-weight: 700; }
button, select, input { font: inherit; color: inherit; margin: 0; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { opacity: .3; }
:focus, :focus-visible { outline: none; }
.kbd :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }  /* only once Tab has been used */
dialog :is(b, input):focus { outline: none; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
canvas { max-width: 100%; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.expense { color: var(--expense-text); } .income { color: var(--income-text); }
.sub { font-size: 13px; color: var(--label2); }
.muted { color: var(--label2); }

/* the glass material */
nav, .ib, .pill, .cluster, .selbar, .seg, .chip, .pick, #toast {
  background: var(--glass); border: .5px solid var(--glass-edge); box-shadow: var(--glass-shine), var(--glass-shadow);
  -webkit-backdrop-filter: blur(22px) saturate(190%); backdrop-filter: blur(22px) saturate(190%);
}

/* large title; its actions float as glass at the top right */
.title { padding: 4px 4px 0; }
.acts { position: fixed; z-index: 3; top: calc(8px + env(safe-area-inset-top)); right: max(16px, calc(50vw - 264px)); display: flex; align-items: center; gap: 8px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--fill); border: .5px solid var(--glass-edge); box-shadow: var(--glass-shadow); }
.link { color: var(--red); font-size: 17px; padding: 6px 4px; }
.link:active, .ib:active, .pill:active { opacity: .55; }
.ib { width: 44px; height: 44px; border-radius: 50%; color: var(--label); display: grid; place-items: center; flex: none; transition: transform .2s cubic-bezier(.16, 1, .3, 1); }
.ib:active, .pill:active { transform: scale(.94); }
.tint { background: #C24A44; border-color: #FFFFFF40; color: #fff; font-weight: 600; box-shadow: inset 0 1px 0 #FFFFFF59, inset 0 -1px 0 #0000000F, 0 8px 20px -8px #00000038; }
.ib.small { width: 32px; height: 32px; color: var(--label2); box-shadow: var(--glass-shine); background: var(--fill); -webkit-backdrop-filter: none; backdrop-filter: none; }
.ib.small svg { width: 15px; height: 15px; }
.pill { height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 500; transition: transform .2s cubic-bezier(.16, 1, .3, 1); }
.pill.on { color: var(--red); font-weight: 600; }
.cluster { display: flex; border-radius: 999px; padding: 0 4px; }
.cluster button { width: 42px; height: 44px; display: grid; place-items: center; }
.cluster button:active { opacity: .5; }
.cluster .accent { color: var(--red); }

/* content layer: opaque grouped lists with the larger concentric radius */
.sect { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--label2); padding: 0 20px; margin: 12px 0 -8px; min-height: 22px; }
.sect .link { font-size: 15px; padding: 0; }
.foot { font-size: 13px; color: var(--label2); padding: 0 20px; margin: -8px 0 0; }
.group { background: var(--surface); border-radius: 26px; overflow: hidden; }
.group > * { position: relative; }
.group > * + *::before { content: ""; position: absolute; top: 0; left: 20px; right: 20px; height: 1px; background: var(--sep); transform: scaleY(.5); transform-origin: top; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 10px 20px; text-align: left; }
.row.tap { cursor: pointer; }
.row.tap:active { background: var(--fill); }
.row.center { justify-content: center; }
.grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.subrow { min-height: 40px; padding: 6px 20px 6px 44px; font-size: 15px; color: var(--label2); }
.chev { color: var(--label2); opacity: .55; width: 16px; height: 16px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.amt { font-weight: 600; }
.pad { padding: 18px 20px; }
.big { font-size: 34px; line-height: 1.2; font-weight: 700; }
.mid { font-size: 20px; font-weight: 600; }
.split { display: grid; grid-template-columns: 1fr 1fr; padding: 12px 20px 14px; gap: 12px; }
.split.three { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.split.three .mid { font-size: 19px; }
.chart { padding: 18px 14px 8px; }
.dash { display: inline-block; width: 14px; border-top: 1.5px dashed var(--label2); vertical-align: middle; margin-left: 4px; }
.donut { width: min(62%, 220px); margin: 0 auto; padding: 20px 0 12px; }.inline-icon { width: 14px; height: 14px; vertical-align: -2px; color: #B58100; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--label2); display: grid; place-items: center; flex: none; color: transparent; }
.check.on { background: var(--red); border-color: var(--red); color: #fff; }
.check svg { width: 14px; height: 14px; stroke-width: 3; }
.empty { text-align: center; color: var(--label2); padding: 36px 24px; font-size: 15px; margin: 0; }

/* controls */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-radius: 999px; padding: 3px; }
.seg button { border-radius: 999px; padding: 6px 4px; font-size: 14px; font-weight: 500; min-height: 36px; }
.seg button.on { background: var(--glass-strong); font-weight: 600; box-shadow: var(--glass-shine), 0 3px 10px -2px #00000026, 0 0 0 .5px var(--glass-edge); }
.stepper { display: flex; align-items: center; justify-content: space-between; }
.stepper b { font-weight: 600; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: -8px -16px; padding: 8px 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border-radius: 999px; padding: 8px 16px; font-size: 15px; box-shadow: var(--glass-shine), 0 2px 8px -2px #0000001A; }
.chip.on { background: var(--red-tint); color: var(--red); font-weight: 600; }
.menu { appearance: none; -webkit-appearance: none; border: 0; background: none; color: var(--red); padding: 0; text-align: right; text-align-last: right; max-width: 62%; min-width: 0; }
input.menu::-webkit-date-and-time-value { text-align: right; }
.switch { appearance: none; -webkit-appearance: none; width: 64px; height: 28px; border-radius: 999px; background: var(--track); position: relative; flex: none; transition: background .25s; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 38px; height: 24px; border-radius: 999px; background: #fff; box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 8px #00000026, 0 1px 1px #00000029; transition: transform .3s cubic-bezier(.16, 1, .3, 1); }
.switch:checked { background: var(--switch); }
.switch:checked::after { transform: translateX(22px); }

/* floating tab bar */
.dock, .selbar { position: fixed; z-index: 3; left: max(16px, calc(50vw - 264px)); right: max(16px, calc(50vw - 264px)); bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; }
.dock .add { width: 58px; height: 58px; }
.dock .add svg { width: 26px; height: 26px; stroke-width: 2.2; }
nav { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(5, 1fr); border-radius: 999px; padding: 4px; }
.selbar { height: 58px; border-radius: 999px; padding: 0 8px 0 20px; }
.selbar .grow { font-weight: 600; white-space: nowrap; }
.selbar button { white-space: nowrap; flex: none; }
.selbar button { height: 42px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500; }
.selbar button:active { background: var(--fill); }
.selecting .dock { display: none; }
nav button { padding: 6px 0 5px; border-radius: 999px; color: var(--label); font-size: 11px; font-weight: 500; display: grid; justify-items: center; gap: 1px; transition: background .25s; }
nav button.on { color: var(--red); background: var(--fill); font-weight: 600; }
nav svg { width: 24px; height: 24px; stroke-width: 1.8; }

/* dialogs: a glass sheet for entries, a compact glass alert for one value or a confirmation */
dialog { border: .5px solid var(--glass-edge); background: var(--sheet); color: var(--label); overflow-y: auto; box-shadow: var(--glass-shine), 0 12px 50px #00000040; -webkit-backdrop-filter: blur(40px) saturate(200%); backdrop-filter: blur(40px) saturate(200%); }
dialog.sheet { margin: auto auto calc(8px + env(safe-area-inset-bottom)); width: calc(100% - 16px); max-width: 544px; height: calc(100dvh - 56px); padding: 0 16px 20px; border-radius: 38px; }
dialog.alert { margin: 18dvh auto auto; width: min(calc(100% - 48px), 340px); padding: 24px 18px 18px; border-radius: 34px; text-align: center; }
dialog.sheet[open] { animation: sheet .45s cubic-bezier(.16, 1, .3, 1); }
dialog.alert[open] { animation: pop .35s cubic-bezier(.16, 1, .3, 1); }
dialog.alert.typing[open] { animation: fade .25s ease-out; }  /* no zoom under a text field: iPhone drew the caret off to the side */
dialog::backdrop { background: var(--dim); animation: fade .25s ease-out; }
@keyframes sheet { from { transform: translateY(105%); } }
@keyframes pop { from { transform: scale(.88); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { dialog[open], dialog::backdrop { animation: none !important; } .switch, .switch::after, .ib, .pill, nav button { transition: none; } }
dialog form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.sheet-bar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding: 14px 0 0; }
.sheet-bar b, .alert b { font-weight: 600; text-align: center; }
.amount { display: flex; justify-content: center; align-items: baseline; gap: 6px; padding: 14px 0 6px; font-size: 56px; line-height: 1.15; font-weight: 700; color: var(--expense-text); font-variant-numeric: tabular-nums; }
.amount span { font-size: 28px; opacity: .55; }
.amount input { border: 0; background: none; padding: 0; text-align: center; min-width: 1.5ch; max-width: 80%; appearance: textfield; -moz-appearance: textfield; }
.amount input::-webkit-outer-spin-button, .amount input::-webkit-inner-spin-button { -webkit-appearance: none; }
.amount input::placeholder { color: inherit; opacity: .35; }
form[data-kind=income] .amount { color: var(--income-text); }
.only-custom { display: none; }
form[data-period=custom] .only-custom { display: flex; }
.group.only-custom { flex-direction: column; }
/* date and time pickers, drawn in the app's own style */
dialog.picker { margin: auto auto calc(8px + env(safe-area-inset-bottom)); width: calc(100% - 16px); max-width: 544px; max-height: calc(100dvh - 56px);
  padding: 18px 16px; border-radius: 38px; }
dialog.picker[open] { animation: sheet .45s cubic-bezier(.16, 1, .3, 1); }
dialog.picker > div { display: grid; gap: 12px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; text-align: center; }
.cal .wd { font-size: 12px; color: var(--label2); padding: 2px 0 6px; }
.cal button { height: 42px; font-size: 16px; font-variant-numeric: tabular-nums; }
.cal button .n { display: grid; place-items: center; width: 38px; height: 38px; margin: auto; border-radius: 50%; }
.cal button.in { background: var(--red-tint); }
.cal button.start { background: linear-gradient(90deg, transparent 50%, var(--red-tint) 50%); }
.cal button.end { background: linear-gradient(90deg, var(--red-tint) 50%, transparent 50%); }
.cal button.today .n { box-shadow: inset 0 0 0 1.5px var(--red); }
.cal button.sel .n { background: #C24A44; color: #fff; font-weight: 600; box-shadow: inset 0 1px 0 #FFFFFF59; }
/* time wheel: each column snaps one 44px row into the band in the middle */
.wheel { position: relative; display: flex; justify-content: center; align-items: center; gap: 4px; height: 220px; margin: 4px 0; }
.wheel .band { position: absolute; inset: 88px 0; border-radius: 14px; background: var(--fill); }
.wheel .col { position: relative; width: 88px; height: 100%; padding: 88px 0; box-sizing: border-box; overflow-y: scroll; scroll-snap-type: y mandatory;
  scrollbar-width: none; -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
.wheel .col::-webkit-scrollbar { display: none; }
.wheel .col div { height: 44px; line-height: 44px; text-align: center; scroll-snap-align: center; font-size: 24px; font-variant-numeric: tabular-nums;
  color: var(--label2); transition: color .15s; cursor: pointer; }
.wheel .col div.on { color: var(--label); font-weight: 600; }
.wheel .colon { position: relative; font-size: 24px; font-weight: 600; padding-bottom: 3px; }
.center { text-align: center; }
.optlist { max-height: 58dvh; overflow-y: auto; }
.optlist .row svg { color: var(--red); width: 20px; height: 20px; }
.value { color: var(--label2); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
form[data-kind=income] .only-expense,
form[data-kind=income] .k-expense, form[data-kind=expense] .k-income { display: none; }
.seg label { display: grid; place-items: center; border-radius: 999px; min-height: 36px; font-size: 14px; font-weight: 500; cursor: pointer; }
.seg input, .pick input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(:checked) { background: var(--glass-strong); font-weight: 600; box-shadow: var(--glass-shine), 0 3px 10px -2px #00000026, 0 0 0 .5px var(--glass-edge); }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 999px; font-size: 15px; cursor: pointer; box-shadow: var(--glass-shine), 0 2px 8px -2px #0000001A; transition: background .2s, color .2s; }
.pick:has(:checked) { background: var(--red-tint); color: var(--red); border-color: transparent; font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--red); }
.pick svg { width: 15px; height: 15px; }
.grip { width: 44px; height: 44px; margin-right: -12px; display: grid; place-items: center; color: var(--label2); touch-action: none; cursor: grab; }
.dragging { z-index: 1; background: var(--glass-strong); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 16px; box-shadow: 0 10px 28px #00000033; }
.dragging::before, .dragging + *::before { display: none; }
.swatches { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 4px 0; }
.sw { position: relative; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; box-shadow: inset 0 1px 0 #FFFFFF66; }
.sw input { position: absolute; opacity: 0; pointer-events: none; }
.sw:has(:checked) { outline: 2.5px solid currentColor; outline-offset: 2.5px; }
.kbd .pick:has(:focus-visible), .kbd .seg label:has(:focus-visible) { outline: 2px solid var(--red); outline-offset: 2px; }
dialog .sect { margin: 0 0 -6px; padding: 0 6px; }
dialog .group { background: var(--surface); }
.field { gap: 16px; }
.field > span { flex: none; }
.field input { flex: 1; min-width: 0; width: 100%; border: 0; background: none; text-align: right; padding: 0; appearance: none; -webkit-appearance: none; }
.field input::-webkit-date-and-time-value { text-align: right; }
.field input::placeholder, .bigfield::placeholder { color: var(--label2); opacity: .75; }
.bigfield { width: 100%; border: 0; border-radius: 999px; background: var(--fill); padding: 12px 18px; text-align: center; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pill.danger { color: var(--red); }
.pill.wide { width: 100%; }
#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); color: var(--label); padding: 10px 18px; border-radius: 999px; font-size: 15px; display: none; z-index: 5; white-space: nowrap; }
</style>
</head>
<body>
