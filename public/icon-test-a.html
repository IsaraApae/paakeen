<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6E4E3" media="(prefers-color-scheme: light)">  <!-- --top-solid; a script adds a third tag only for a picked theme opposite the phone's -->
<meta name="theme-color" content="#200905" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">  <!-- ?v= makes browsers drop an icon (or "no icon") they cached; bump it when the icon changes -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">  <!-- iPhone browsers take the page icon from this -->
<link rel="manifest" href="/manifest.webmanifest">
<title>Test A</title>
</head>
<body style="font: 20px -apple-system, sans-serif; padding: 40px 16px">Test A: ป้าคีน's icon tags, nothing else</body>
</html>
