name = "paakeen"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"  # the worker reads menu.jpg from here to upload as the chat menu image

[[d1_databases]]
binding = "DB"
database_name = "paakeen"
database_id = "80bb3b33-144e-40b6-b6b1-c7d66c1be89b"

[triggers]
crons = ["*/5 * * * *"]  # daily reminders (up to 5 minutes late) and chat-menu refreshes

[vars]
APP_ORIGIN = "https://paakeen.p-isarabhakdi.workers.dev"  # used by the scheduled job, which has no request to read it from
# tried in order; the next one is used when a model is overloaded or out of free quota
# photos, voice notes, PDFs: live timings showed 3.8 and 3.5 Flash taking over 9s on a slip and a voice note while
# Flash-Lite answered in ~1.6s, so Flash-Lite goes first and the stronger ones step in if it is slow
GEMINI_MODEL = "gemini-3.5-flash-lite,gemini-3.8-flash,gemini-3.5-flash,gemini-2.5-flash"
GEMINI_FAST_MODEL = "gemini-3.5-flash-lite,gemini-3.8-flash,gemini-3.5-flash,gemini-2.5-flash"  # typed messages: quickest model first

# Secrets, set once with `wrangler secret put <NAME>`:
#   LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN, GEMINI_API_KEY
