name = "paakeen"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"  # the worker reads menu.jpg from here to upload as the chat menu image

[[d1_databases]]
binding = "DB"
database_name = "paakeen"
database_id = "80bb3b33-144e-40b6-b6b1-c7d66c1be89b"

[triggers]
crons = ["*/5 * * * *"]  # daily reminders (up to 5 minutes late) and chat-menu refreshes

# keep the worker's logs (errors, and each reply's timings) for a few days, so they can be read in the Cloudflare
# dashboard afterwards and not only while `wrangler tail` is running
[observability]
enabled = true

[vars]
APP_ORIGIN = "https://paakeen.p-isarabhakdi.workers.dev"  # used by the scheduled job, which has no request to read it from
# tried in order; the next one is used when a model is overloaded, retired or out of free quota (all on the free tier, Nov 2026)
# Flash-Lite first: live timings showed it answering slips and voice notes in ~1.6s while the bigger Flash models took 9s+.
# Then the newest free models. 2.5 Flash (shut down 1 Dec 2026) and 3.5 Flash (now routed to 3.6 Flash) are gone.
GEMINI_MODEL = "gemini-3.5-flash-lite,gemini-4-hydrogen,gemini-3.6-flash,gemini-3.8-flash"
GEMINI_FAST_MODEL = "gemini-3.5-flash-lite,gemini-4-hydrogen,gemini-3.6-flash,gemini-3.8-flash"  # typed messages

# Secrets, set once with `wrangler secret put <NAME>`:
#   LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN, GEMINI_API_KEY
